name: 24/7 Smart Auto Scraper & Catalog Sync

on:
  schedule:
    # Her 2 saatte bir otomatik çalışır (7/24 kesintisiz yeni bölüm & seri takibi)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Çalışma Modu (smart: Vitrin + Delta Bölüm + Kuyruk | delta-only: Sadece Yeni Bölüm | enrich-only: Sadece Metadata & Türkçe Açıklama)'
        required: false
        default: 'smart'
        type: choice
        options:
          - smart
          - delta-only
          - enrich-only
      batch_size:
        description: 'Kuyruktan çekilecek yeni seri sayısı'
        required: false
        default: '50'
        type: string
      max_delta_checks:
        description: 'Mevcut serilerde yeni bölüm kontrol limiti'
        required: false
        default: '200'
        type: string
      max_enrich_checks:
        description: 'Çalışma başına maksimum metadata zenginleştirme limiti'
        required: false
        default: '80'
        type: string
      source:
        description: 'Sadece belirli bir kaynağı tara (boş bırakılırsa tüm ana kaynaklar: webtoonhatti, okutoon, siyahmelek, hattorimanga, mangadass)'
        required: false
        default: ''
        type: string

concurrency:
  group: toonparrot-auto-scraper
  cancel-in-progress: false

jobs:
  sync-catalog:
    name: Smart Delta Scraper & Multi-Source Metadata Sync
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore Local Scraper Cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: toonparrot-scraper-cache-${{ github.run_id }}
          restore-keys: |
            toonparrot-scraper-cache-

      - name: Run Smart Catalog & Delta Chapter Sync
        env:
          VITE_CATALOG_WORKER_URL: ${{ secrets.VITE_CATALOG_WORKER_URL }}
          VITE_SCRAPER_PROXY_URL: ${{ secrets.VITE_SCRAPER_PROXY_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CATALOG_ADMIN_TOKEN: ${{ secrets.CATALOG_ADMIN_TOKEN }}
          INPUT_MODE: ${{ github.event.inputs.mode || 'smart' }}
          INPUT_BATCH_SIZE: ${{ github.event.inputs.batch_size || '50' }}
          INPUT_MAX_DELTA_CHECKS: ${{ github.event.inputs.max_delta_checks || '200' }}
          INPUT_MAX_ENRICH_CHECKS: ${{ github.event.inputs.max_enrich_checks || '80' }}
          INPUT_SOURCE: ${{ github.event.inputs.source || '' }}
        run: |
          if ! [[ "$INPUT_BATCH_SIZE" =~ ^[0-9]+$ ]]; then INPUT_BATCH_SIZE="50"; fi
          if ! [[ "$INPUT_MAX_DELTA_CHECKS" =~ ^[0-9]+$ ]]; then INPUT_MAX_DELTA_CHECKS="200"; fi
          if ! [[ "$INPUT_MAX_ENRICH_CHECKS" =~ ^[0-9]+$ ]]; then INPUT_MAX_ENRICH_CHECKS="80"; fi
          ARGS=(
            --mode "$INPUT_MODE"
            --batch-size "$INPUT_BATCH_SIZE"
            --max-delta-checks "$INPUT_MAX_DELTA_CHECKS"
            --max-enrich-checks "$INPUT_MAX_ENRICH_CHECKS"
            --front-pages "5"
          )
          if [ -n "$INPUT_SOURCE" ]; then
            if [[ "$INPUT_SOURCE" =~ ^[a-z0-9_-]+$ ]]; then
              ARGS+=(--source "$INPUT_SOURCE")
            else
              echo "Invalid source input ignored"
            fi
          fi
          node scripts/auto-catalog-sync.mjs "${ARGS[@]}"
